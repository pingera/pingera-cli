name: Release

# Push a tag like v0.2.0 (or 0.2.0) to publish that version to PyPI and create a GitHub release.
# The tag must match the version of the built package (pingera_cli.__version__).
on:
  push:
    tags: ["v*.*.*", "[0-9]*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build
        run: |
          python -m pip install build twine
          rm -rf build dist
          python -m build
          python -m twine check --strict dist/*

      - name: Check tag matches the package version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          wheel="$(ls dist/*.whl)"
          package_version="$(basename "$wheel" | cut -d- -f2)"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the built package version $package_version"
            exit 1
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/pngr --version
          /tmp/wheel-test/bin/pngr --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pingera-cli/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
